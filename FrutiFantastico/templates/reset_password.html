<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña | FrutiFantastico</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(135deg,#0b8700,#85f074);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .contenedor{
            background:white;
            padding:40px;
            border-radius:20px;
            width:350px;
            text-align:center;
            box-shadow:0px 0px 20px rgba(0,0,0,0.2);
        }

        h1{
            color:#85f074;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:#f2f2f2;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#85f074;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#004912;
        }

        p{
            color:#555;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Nueva Contraseña</h1>

        <p>{{ correo }}</p>

        <form method="POST">

            <input
            type="password"
            name="password"
            placeholder="Nueva contraseña"
            required
            >

            <button type="submit">
                Guardar contraseña
            </button>

        </form>

    </div>

</body>

</html>
